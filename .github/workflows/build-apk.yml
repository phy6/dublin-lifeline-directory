name: Build Android APK from HTML

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App & Add Platform
        run: |
          cordova create build_tmp com.dublin.lifeline "Dublin Support"
          cp index.html build_tmp/www/index.html
          cp config.xml build_tmp/config.xml
          cd build_tmp
          cordova platform add android

      - name: Build Android APK
        run: |
          cd build_tmp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dublin-lifeline-apk
          path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
