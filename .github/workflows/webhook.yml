name: Webhook Handler
on:
  workflow_dispatch:
  repository_dispatch:
    types: [form-submission]

jobs:
  handle-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Process form submission
        run: |
          echo "Processing form submission from Web3Forms"
          echo "Merge into services.json and redeploy"
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Add new provider from form"
          git push
        continue-on-error: true
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static
          publish_branch: gh-pages
